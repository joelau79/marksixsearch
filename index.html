<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Six Search - 香港6彩歷史查詢</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
        }
        .last-updated {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 20px;
        }

        /* Search Section */
        .search-box {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .search-box h2 {
            color: #ffd700;
            margin-bottom: 15px;
        }
        .number-inputs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .number-input {
            width: 60px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            background: #0f3460;
            color: #fff;
            -moz-appearance: textfield;
        }
        .number-input::-webkit-outer-spin-button,
        .number-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .number-input:focus {
            outline: none;
            background: #1a4a7a;
        }
        .btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #ffd700;
            color: #1a1a2e;
        }
        .btn-primary:hover {
            background: #ffed4a;
        }
        .btn-secondary {
            background: #4a4a6a;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #6a6a8a;
        }
        .btn-lucky {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            font-weight: bold;
        }
        .btn-lucky:hover {
            background: linear-gradient(135deg, #ffed4a, #ffa500);
            transform: scale(1.05);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #16213e;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 2px solid #ffd700;
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #ffd700;
        }
        .modal h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .lucky-group {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .lucky-group-title {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lucky-group-title .fire {
            font-size: 18px;
        }
        .lucky-numbers {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .lucky-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
        }
        .lucky-ball.red { background: #e74c3c; }
        .lucky-ball.blue { background: #3498db; }
        .lucky-ball.green { background: #2ecc71; }
        .lucky-ball.gold {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
        }
        .btn-regenerate {
            background: #4a4a6a;
            color: #fff;
            width: 100%;
            margin-top: 10px;
        }
        .btn-regenerate:hover {
            background: #6a6a8a;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #16213e;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card .label {
            color: #888;
            font-size: 14px;
        }
        .stat-card .value {
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
        }

        /* Results */
        .results {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .results-header h2 {
            color: #ffd700;
        }

        .result-item {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .result-item:hover {
            background: #1a4a7a;
        }
        .result-period {
            color: #ffd700;
            font-weight: bold;
            min-width: 70px;
            font-size: 14px;
        }
        .result-date {
            color: #888;
            font-size: 14px;
            min-width: 110px;
        }
        .result-numbers {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ball {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }
        .ball.red { background: #e74c3c; color: white; }
        .ball.blue { background: #3498db; color: white; }
        .ball.green { background: #2ecc71; color: white; }
        .ball.special {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
        }
        /* 官方波色 */
        .ball.red-oc { background: #d32f2f; color: white; }
        .ball.blue-oc { background: #1976d2; color: white; }
        .ball.green-oc { background: #388e3c; color: white; }
        .ball.matched { box-shadow: 0 0 0 3px #ffd700; }
        /* 運財號碼球 */
        .lucky-ball.red-oc { background: #d32f2f; color: white; }
        .lucky-ball.blue-oc { background: #1976d2; color: white; }
        .lucky-ball.green-oc { background: #388e3c; color: white; }
        .lucky-ball.gold { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; }
        .result-count {
            color: #ffd700;
            font-weight: bold;
            min-width: 80px;
            text-align: right;
        }
        .result-tag {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .tag-jinduobao {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            font-weight: bold;
        }
        .tag-special-jinduobao {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            font-weight: bold;
        }

        /* Frequency */
        .frequency-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-top: 20px;
        }
        .freq-item {
            background: #0f3460;
            padding: 8px 4px;
            border-radius: 5px;
            text-align: center;
        }
        .freq-item .num {
            font-size: 16px;
            font-weight: bold;
        }
        .freq-item .count {
            font-size: 11px;
            color: #888;
        }
        .freq-item.hot { background: #e74c3c; }
        .freq-item.cold { background: #3498db; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab {
            padding: 10px 20px;
            background: #0f3460;
            border: none;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
        }
        .tab.active {
            background: #ffd700;
            color: #1a1a2e;
        }

        .hidden { display: none; }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .page-btn {
            padding: 8px 15px;
            background: #0f3460;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
        }
        .page-btn.active {
            background: #ffd700;
            color: #1a1a2e;
        }
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .result-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .result-count {
                text-align: left;
            }
            .result-period, .result-date {
                min-width: unset;
            }
            .number-input {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
            .ball {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>🔍 Mark Six Search</h1>
    <p class="subtitle">香港6彩歷史開獎查詢</p>
    <p class="last-updated" id="lastUpdated">載入中...</p>

    <div class="search-box">
        <h2>輸入號碼</h2>
        <p style="color: #888; margin-bottom: 10px;">輸入要搜索的號碼(1-49),單式投注選6個</p>
        <div class="number-inputs">
            <input type="number" class="number-input" id="num1" min="1" max="49">
            <input type="number" class="number-input" id="num2" min="1" max="49">
            <input type="number" class="number-input" id="num3" min="1" max="49">
            <input type="number" class="number-input" id="num4" min="1" max="49">
            <input type="number" class="number-input" id="num5" min="1" max="49">
            <input type="number" class="number-input" id="num6" min="1" max="49">
        </div>
        <div style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="searchNumbers()">
                <i class="fas fa-search"></i> 搜索
            </button>
            <button class="btn btn-secondary" onclick="clearSearch()">
                <i class="fas fa-times"></i> 清除
            </button>
            <button class="btn btn-lucky" onclick="openLuckyModal()">
                <i class="fas fa-coins"></i> 運財號碼
            </button>
            <button class="btn btn-secondary" onclick="location.reload()">
                <i class="fas fa-sync-alt"></i> 重新整理
            </button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="label">總記錄數</div>
            <div class="value" id="totalRecords">-</div>
        </div>
        <div class="stat-card">
            <div class="label">搜索結果</div>
            <div class="value" id="searchResults">-</div>
        </div>
        <div class="stat-card">
            <div class="label">熱門號碼</div>
            <div class="value" id="hotNumber">-</div>
        </div>
        <div class="stat-card">
            <div class="label">冷門號碼</div>
            <div class="value" id="coldNumber">-</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('history')">歷史記錄</button>
        <button class="tab" onclick="showTab('frequency')">號碼頻率</button>
        <button class="tab" onclick="showTab('search')">搜索結果</button>
    </div>

    <div class="results" id="historyTab">
        <div class="results-header">
            <h2>歷史開獎記錄</h2>
        </div>
        <div id="historyList"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div class="results hidden" id="frequencyTab">
        <div class="results-header">
            <h2>號碼出現頻率</h2>
        </div>
        <p style="color: #888; margin-bottom: 15px;">紅色=熱門 | 藍色=冷門</p>
        <div class="frequency-grid" id="frequencyGrid"></div>
    </div>

    <div class="results hidden" id="searchTab">
        <div class="results-header">
            <h2>搜索結果</h2>
            <span id="searchSummary" style="color: #888;"></span>
        </div>
        <div id="searchResultsList"></div>
        <div class="pagination" id="searchPagination"></div>
    </div>

    <!-- 運財號碼 Modal -->
    <div class="modal-overlay" id="luckyModal" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <button class="modal-close" onclick="closeLuckyModal()">&times;</button>
            <h2>🍀 運財號碼</h2>
            <div id="luckyNumbersContainer"></div>
            <button class="btn btn-regenerate" onclick="regenerateLuckyNumbers()">
                <i class="fas fa-sync-alt"></i> 重新生成隨機號碼
            </button>
        </div>
    </div>

    <script src="full_data.js"></script>
    <script>
        let currentPage = 1;
        let searchPage = 1;
        const pageSize = 20;
        let currentSearchResults = [];
        let currentTab = 'history';

        let selectedNumbers = [];

        let lastUpdatedText = '載入中...';

        // ===== 自動更新：從 lottolyzer.com 抓取最新數據 =====
        const STORAGE_KEY = 'marksix_cache';
        const LAST_FETCH_KEY = 'marksix_last_fetch';
        const FULL_DATA_KEY = 'marksix_full';
        const FETCH_INTERVAL_MS = 7 * 24 * 60 * 60 * 1000; // 7天

        function daysSince(timestamp) {
            return Math.floor((Date.now() - timestamp) / (24 * 60 * 60 * 1000));
        }

        async function fetchLatestData() {
            const lastFetch = localStorage.getItem(LAST_FETCH_KEY);
            const lastFetchTime = lastFetch ? parseInt(lastFetch) : 0;
            const daysAgo = lastFetch ? daysSince(lastFetchTime) : null;

            // 安全檢查：localStorage 的數據必須完全正確才能使用
            // 錯誤的 localStorage 會覆蓋 full_data.js 的正確數據
            try {
                const fullBackup = localStorage.getItem(FULL_DATA_KEY);
                if (fullBackup) {
                    const parsed = JSON.parse(fullBackup);
                    // 驗證：必須是數組、至少有 3000 條記錄、最後一條是 93/001
                    if (Array.isArray(parsed) && 
                        parsed.length >= 3000 && 
                        parsed[parsed.length - 1] && 
                        parsed[parsed.length - 1][0] === '93/001') {
                        // 數據驗證通過，才使用 localStorage
                        markSixData = parsed;
                    } else {
                        // 數據不正確，刪除錯誤的 localStorage
                        localStorage.removeItem(FULL_DATA_KEY);
                    }
                }
            } catch (e) { 
                localStorage.removeItem(FULL_DATA_KEY);
            }

            // 嘗試讀取快取（30分鐘有效）— 不再用於主要數據源
            let cachedData = [];
            let fromCache = false;
            try {
                const cached = localStorage.getItem(STORAGE_KEY);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    const cacheAge = Date.now() - timestamp;
                    if (cacheAge < 30 * 60 * 1000 && Array.isArray(data) && data.length > 0) {
                        cachedData = data;
                        fromCache = true;
                    }
                }
            } catch (e) { /* ignore */ }

            // 不再自動抓取 lottolyzer.com（避免數據污染）
            // 手動更新請使用獨立的更新腳本
            return { data: cachedData, fromCache, daysAgo, fetched: false };
        }

        function parseLottolyzerTable(html) {
            const results = [];
            const rowPattern = /<tr[^>]*>([\s\S]*?)<\/tr>/g;
            let match;
            while ((match = rowPattern.exec(html)) !== null) {
                const row = match[1];
                const allNums = [...row.matchAll(/(\d+)/g)].map(m => parseInt(m[1]));
                if (allNums.length >= 7) {
                    const nums = allNums.slice(0, 7);
                    if (nums[0] >= 1 && nums[0] <= 49) {
                        const periodMatch = row.match(/(\d{2}\/\d{3})/);
                        const dateMatch = row.match(/(\d{4}-\d{2}-\d{2})/);
                        if (periodMatch && dateMatch) {
                            results.push([periodMatch[1], dateMatch[1], nums, '']);
                        }
                    }
                }
            }
            // 去重並按日期排序（最新在前）
            const seen = new Set();
            const deduped = results.filter(r => {
                if (seen.has(r[1])) return false;
                seen.add(r[1]);
                return true;
            });
            deduped.sort((a, b) => b[1].localeCompare(a[1]));
            return deduped;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // markSixData 來自 full_data.js（全局 const）
            // 已經由 fetchLatestData() 驗證並載入
            
            // 顯示數據信息
            if (markSixData && markSixData.length > 0) {
                const firstDate = markSixData[0] ? markSixData[0][1] : '';
                const lastRecord = markSixData[markSixData.length - 1];
                const lastDate = lastRecord ? lastRecord[1] : '';
                document.getElementById('lastUpdated').textContent = 
                    `📊 總記錄：${markSixData.length}條 | 數據範圍：${lastDate} 至 ${firstDate}`;
            }
            
            updateStats();
            renderHistory();
            renderFrequency();
        });

        function searchNumbers() {
            selectedNumbers = [];
            for (let i = 1; i <= 6; i++) {
                const input = document.getElementById('num' + i);
                const val = parseInt(input.value);
                if (val >= 1 && val <= 49 && !selectedNumbers.includes(val)) {
                    selectedNumbers.push(val);
                }
            }

            if (selectedNumbers.length === 0) {
                alert('請輸入至少1個號碼 (1-49)');
                return;
            }

            const sortedSearch = [...selectedNumbers].sort((a, b) => a - b);

            // Search by prize tier
            let jackpotRecords = [];
            let secondRecords = [];

            markSixData.forEach(record => {
                const mainNums = record[2].slice(0, 6);
                const specialNum = record[2][6];

                const mainMatchCount = sortedSearch.filter(n => mainNums.includes(n)).length;
                const hasSpecial = sortedSearch.includes(specialNum);

                if (mainMatchCount === 6) {
                    jackpotRecords.push(record);
                } else if (mainMatchCount === 5 && hasSpecial) {
                    secondRecords.push(record);
                }
            });

            currentSearchResults = [...jackpotRecords, ...secondRecords];

            let summaryHtml = `<span style="color: #ffd700;">輸入號碼:${sortedSearch.join(', ')}</span><br><br>`;
            summaryHtml += `<span style="color: #2ecc71;">🎯 頭獎(6中6):${jackpotRecords.length} 次</span><br>`;
            summaryHtml += `<span style="color: #3498db;">🏆 二獎(5中+特別號):${secondRecords.length} 次</span>`;

            document.getElementById('searchSummary').innerHTML = summaryHtml;
            document.getElementById('searchResults').textContent = currentSearchResults.length;

            searchPage = 1;
            showTab('search');
            renderSearchResults();
        }

        function renderSearchResults() {
            const list = document.getElementById('searchResultsList');
            const start = (searchPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = currentSearchResults.slice(start, end);

            if (pageData.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #888; padding: 40px;">沒有找到頭獎或二獎記錄</p>';
                return;
            }

            const sortedSearch = [...selectedNumbers].sort((a, b) => a - b);

            list.innerHTML = pageData.map(record => {
                const period = record[0];
                const date = record[1];
                const numbers = record[2];
                const mainNums = numbers.slice(0, 6);
                const specialNum = numbers[6];
                const tag = record[3];

                const mainMatchCount = sortedSearch.filter(n => mainNums.includes(n)).length;
                const hasSpecial = sortedSearch.includes(specialNum);

                let prizeLabel = '';
                let prizeColor = '';
                if (mainMatchCount === 6) {
                    prizeLabel = '🎯 頭獎';
                    prizeColor = 'color: #2ecc71;';
                } else if (mainMatchCount === 5 && hasSpecial) {
                    prizeLabel = '🏆 二獎';
                    prizeColor = 'color: #3498db;';
                }

                const tagHtml = tag ? `<span class="result-tag ${tag.includes('特別') ? 'tag-special-jinduobao' : 'tag-jinduobao'}">${tag}</span>` : '';
                const prizeHtml = prizeLabel ? `<span style="${prizeColor}">${prizeLabel}</span>` : '';

                return `
                    <div class="result-item">
                        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 70px;">
                            <div class="result-period">${period}</div>
                            <div class="result-date">${date}</div>
                        </div>
                        <div class="result-numbers">
                            ${mainNums.map(n => {
                                const isMatch = sortedSearch.includes(n);
                                return `<div class="ball ${getBallColor(n)}${isMatch ? ' matched' : ''}">${n}</div>`;
                            }).join('')}
                            <div class="ball special">${specialNum}</div>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 90px;">
                            ${tagHtml}
                            ${prizeHtml}
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(currentSearchResults.length, searchPage, 'searchPagination');
        }

        function renderPagination(total, page, elementId) {
            const totalPages = Math.ceil(total / pageSize);
            const container = document.getElementById(elementId);

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            html += `<button class="page-btn" onclick="changePage(${page - 1}, '${elementId}')" ${page === 1 ? 'disabled' : ''}>上一頁</button>`;
            html += `<span style="color: #888; padding: 8px;">第 ${page} / ${totalPages} 頁</span>`;
            html += `<button class="page-btn" onclick="changePage(${page + 1}, '${elementId}')" ${page === totalPages ? 'disabled' : ''}>下一頁</button>`;

            container.innerHTML = html;
        }

        function changePage(newPage, elementId) {
            if (elementId === 'pagination') {
                currentPage = newPage;
                renderHistory();
            } else {
                searchPage = newPage;
                renderSearchResults();
            }
        }

        function clearSearch() {
            for (let i = 1; i <= 6; i++) {
                document.getElementById('num' + i).value = '';
            }
            selectedNumbers = [];
            currentSearchResults = [];
            document.getElementById('searchResults').textContent = '-';
            document.getElementById('searchSummary').textContent = '';
            showTab('history');
        }

        function updateStats() {
            document.getElementById('totalRecords').textContent = markSixData.length;

            const freq = {};
            for (let i = 1; i <= 49; i++) freq[i] = 0;
            markSixData.forEach(record => {
                record[2].forEach(num => freq[num]++);
            });

            let maxFreq = 0, minFreq = Infinity;
            let hotNum = 1, coldNum = 1;
            for (let i = 1; i <= 49; i++) {
                if (freq[i] > maxFreq) { maxFreq = freq[i]; hotNum = i; }
                if (freq[i] < minFreq) { minFreq = freq[i]; coldNum = i; }
            }

            document.getElementById('hotNumber').textContent = hotNum;
            document.getElementById('coldNumber').textContent = coldNum;
            document.getElementById('searchResults').textContent = '-';
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = markSixData.slice(start, end);

            list.innerHTML = pageData.map(record => {
                const period = record[0];
                const date = record[1];
                const numbers = record[2];
                const mainNums = numbers.slice(0, 6);
                const specialNum = numbers[6];
                const tag = record[3];

                const tagHtml = tag
                    ? `<span class="result-tag ${tag.includes('特別') ? 'tag-special-jinduobao' : 'tag-jinduobao'}">${tag}</span>`
                    : '';

                return `
                    <div class="result-item">
                        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 70px;">
                            <div class="result-period">${period}</div>
                            <div class="result-date">${date}</div>
                        </div>
                        <div class="result-numbers">
                            ${mainNums.map(n => `<div class="ball ${getBallColor(n)}">${n}</div>`).join('')}
                            <div class="ball special">${specialNum}</div>
                        </div>
                        <div style="min-width: 90px; text-align: right;">
                            ${tagHtml}
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(markSixData.length, currentPage, 'pagination');
        }

        function renderFrequency() {
            const grid = document.getElementById('frequencyGrid');
            const freq = {};
            for (let i = 1; i <= 49; i++) freq[i] = 0;
            markSixData.forEach(record => {
                record[2].forEach(num => freq[num]++);
            });

            const maxFreq = Math.max(...Object.values(freq));
            const minFreq = Math.min(...Object.values(freq));

            grid.innerHTML = Array.from({length: 49}, (_, i) => {
                const num = i + 1;
                const count = freq[num];
                const isHot = count === maxFreq;
                const isCold = count === minFreq;
                let className = 'freq-item';
                if (isHot) className += ' hot';
                else if (isCold) className += ' cold';

                return `
                    <div class="${className}">
                        <div class="num">${num}</div>
                        <div class="count">${count}次</div>
                    </div>
                `;
            }).join('');
        }

        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const tabIndex = tab === 'history' ? 1 : tab === 'frequency' ? 2 : 3;
            document.querySelector(`.tab:nth-child(${tabIndex})`).classList.add('active');

            document.getElementById('historyTab').classList.add('hidden');
            document.getElementById('frequencyTab').classList.add('hidden');
            document.getElementById('searchTab').classList.add('hidden');
            document.getElementById(tab + 'Tab').classList.remove('hidden');
        }

        // ===== 運財號碼功能 =====
        function getBallColor(num) {
            // 官方波色分佈
            const red = [1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46];
            const blue = [3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
            const green = [5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49];
            if (red.includes(num)) return 'red-oc';
            if (blue.includes(num)) return 'blue-oc';
            if (green.includes(num)) return 'green-oc';
            return 'special';
        }
        
        function calculateFrequency() {
            const freq = {};
            for (let i = 1; i <= 49; i++) freq[i] = 0;
            markSixData.forEach(record => {
                record[2].slice(0, 6).forEach(num => freq[num]++);
            });
            return freq;
        }

        function getHotNumbers(topN = 6) {
            const freq = calculateFrequency();
            const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
            return sorted.slice(0, topN).map(e => parseInt(e[0]));
        }

        function getAllHistoricalMainNumbers() {
            const allSets = [];
            markSixData.forEach(record => {
                const mainNums = record[2].slice(0, 6).sort((a, b) => a - b);
                allSets.push(mainNums.join(','));
            });
            return allSets;
        }

        function generateUniqueRandomSet(historicalSets) {
            const maxAttempts = 1000;
            for (let i = 0; i < maxAttempts; i++) {
                const numbers = [];
                while (numbers.length < 6) {
                    const rand = Math.floor(Math.random() * 49) + 1;
                    if (!numbers.includes(rand)) {
                        numbers.push(rand);
                    }
                }
                numbers.sort((a, b) => a - b);
                const key = numbers.join(',');
                if (!historicalSets.includes(key)) {
                    return numbers;
                }
            }
            return null;
        }

        function getLuckyColor(index) {
            const colors = ['red', 'blue', 'green', 'gold'];
            return colors[index % colors.length];
        }

        function renderLuckyNumbers() {
            const container = document.getElementById('luckyNumbersContainer');
            const hotNumbers = getHotNumbers(6);
            const historicalSets = getAllHistoricalMainNumbers();

            let html = '';

            // 第1組：熱門號碼
            html += `<div class="lucky-group">
                <div class="lucky-group-title"><span class="fire">🔥</span> 第1組：熱門號碼（出現次數最多）</div>
                <div class="lucky-numbers">
                    ${hotNumbers.map((n, i) => `<div class="lucky-ball ${getBallColor(n)}">${n}</div>`).join('')}
                </div>
            </div>`;

            // 第2-4組：隨機號碼
            for (let g = 2; g <= 4; g++) {
                const randNums = generateUniqueRandomSet(historicalSets);
                html += `<div class="lucky-group">
                    <div class="lucky-group-title"><span class="fire">✨</span> 第${g}組：隨機號碼</div>
                    <div class="lucky-numbers">
                        ${randNums.map(n => `<div class="lucky-ball ${getBallColor(n)}">${n}</div>`).join('')}
                    </div>
                </div>`;
            }

            container.innerHTML = html;
        }

        function openLuckyModal() {
            renderLuckyNumbers();
            document.getElementById('luckyModal').classList.add('active');
        }

        function closeLuckyModal() {
            document.getElementById('luckyModal').classList.remove('active');
        }

        function closeModalOnOverlay(event) {
            if (event.target === document.getElementById('luckyModal')) {
                closeLuckyModal();
            }
        }

        function regenerateLuckyNumbers() {
            renderLuckyNumbers();
        }
    </script>
</body>
</html>
